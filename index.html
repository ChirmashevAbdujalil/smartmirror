<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b10">
  <title>Smart Mirror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mirror.css">
</head>
<body>
  <div class="mirror">
    <header class="topbar">
      <div class="clock">
        <div class="time" id="time">--:--</div>
        <div class="weather" id="weather">
          <span class="w-icon">☀</span><span class="w-temp">--°C</span><span class="w-city"></span>
        </div>
      </div>
      <div class="brand">
        <span class="brand-name">Smart <b>Mirror</b></span>
        <span class="brand-sub">O'zingizning uslubingiz — endi yanada oson!</span>
      </div>
      <button class="icon-btn" id="btn-settings" aria-label="Sozlamalar" title="Sozlamalar">⚙</button>
    </header>

    <main class="stage-wrap">
      <section class="stage" id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>

        <div class="stage-info">
          <div class="status" id="status"><span class="dot"></span><span id="status-text">Manekin rejimi</span></div>
          <div class="session" id="session" hidden></div>
        </div>

        <div class="stage-actions">
          <button class="round-btn" id="btn-camera" title="Kamera">📷</button>
          <button class="round-btn" id="btn-snap" title="Rasmga olish">⤓</button>
          <button class="round-btn" id="btn-save-look" title="Obrazni saqlash">♡</button>
          <button class="round-btn" id="btn-clear" title="Tozalash">✕</button>
        </div>

        <div class="look" id="look"></div>
      </section>

      <aside class="rail" id="rail" aria-label="Kiyimlar"></aside>
    </main>

    <nav class="filters" id="filters">
      <button data-filter="style"><span>👗</span>Turi / uslublar</button>
      <button data-filter="size"><span>📏</span>O'lcham</button>
      <button data-filter="color"><span>🎨</span>Ranglar</button>
      <button data-filter="recs"><span>★</span>Tavsiyalar</button>
    </nav>

    <nav class="tabbar">
      <button class="active" data-tab="clothes"><span class="ti">👚</span>Kiyimlar</button>
      <button data-tab="favs"><span class="ti">♡</span>Sevimlilar</button>
      <button data-tab="more"><span class="ti">⋯</span>Boshqa</button>
    </nav>

    <div class="sheet-backdrop" id="backdrop" hidden></div>
    <section class="sheet" id="sheet" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-body" id="sheet-body"></div>
    </section>

    <div class="toast" id="toast" hidden></div>

    <div class="idle" id="idle" hidden>
      <div class="idle-inner">
        <div class="idle-title">Smart <b>Mirror</b></div>
        <div class="idle-sub">Boshlash uchun ekranga teging</div>
        <div class="idle-hint">Bir necha kiyimni 2 daqiqada sinab ko'ring</div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
