<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Do'kon paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="head">
    <div>
      <div class="eyebrow">Smart Mirror</div>
      <h1>Do'kon <b>paneli</b></h1>
    </div>
    <a class="btn ghost" href="index.html">← Ko'zguga qaytish</a>
  </header>

  <main>
    <section class="stats" id="stats"></section>

    <section class="card-block">
      <div class="block-head">
        <h2>Eng ko'p sinab ko'rilgan kiyimlar</h2>
        <button class="btn ghost small" id="reset-stats">Statistikani tozalash</button>
      </div>
      <div id="top"></div>
    </section>

    <section class="card-block">
      <div class="block-head">
        <h2>Katalog</h2>
        <div class="actions">
          <button class="btn" id="add">+ Kiyim qo'shish</button>
          <button class="btn ghost small" id="export">Eksport (JSON)</button>
          <label class="btn ghost small">Import<input type="file" id="import" accept="application/json" hidden></label>
          <button class="btn ghost small danger" id="reset">Standart katalog</button>
        </div>
      </div>
      <div class="table-wrap"><table id="table"></table></div>
    </section>

    <section class="card-block">
      <h2>Sozlamalar</h2>
      <form id="settings" class="settings">
        <label>Do'kon nomi<input name="storeName"></label>
        <label>Kutish rejimi (soniya)<input name="idleSeconds" type="number" min="20" max="900"></label>
        <label>Shahar<select name="city"></select></label>
        <button class="btn" type="submit">Saqlash</button>
      </form>
    </section>
  </main>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlg-title">Kiyim</h2>
      <div class="form-grid">
        <label class="wide">Nomi<input name="name" required maxlength="60"></label>
        <label>Turi<select name="type"></select></label>
        <label>Uslub<select name="style"></select></label>
        <label>Rang<select name="color"></select></label>
        <label>Narx (so'm)<input name="price" type="number" min="0" step="1000" required></label>
        <fieldset class="wide"><legend>Omborda (dona)</legend><div class="sizes" id="sizes"></div></fieldset>
        <label class="wide">Rasm (shaffof fonli PNG, ixtiyoriy)
          <input name="image" type="file" accept="image/png,image/webp">
          <small>Rasm bo'lmasa, kiyim turi va rangiga qarab avtomatik tasvir yaratiladi.</small>
        </label>
        <div class="wide preview-row">
          <img id="preview" alt="">
          <button type="button" class="btn ghost small" id="clear-image">Rasmni olib tashlash</button>
        </div>
      </div>
      <div class="dlg-actions">
        <button class="btn ghost" value="cancel" formnovalidate>Bekor qilish</button>
        <button class="btn" value="ok" id="save">Saqlash</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
