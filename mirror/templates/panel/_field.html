{% load panel_tags %}{% if field|is_checkbox %}
<div class="field {{ cls }}"><div class="check">{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}</label></div>
{% if field.errors %}<div class="errors">{{ field.errors|join:" " }}</div>{% endif %}</div>
{% else %}
<div class="field {{ cls }}{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<span class="help">{{ field.help_text|safe }}</span>{% endif %}
  {% if field.errors %}<div class="errors">{{ field.errors|join:" " }}</div>{% endif %}
</div>
{% endif %}
